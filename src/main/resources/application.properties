spring.application.name=doodlemart-product

spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=doodlemart_product
spring.flyway.default-schema=doodlemart_product
spring.flyway.create-schemas=true

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=doodlemart_product

server.port=8081
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

doodlemart.kafka.topic.product-created=product-created

spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.retry.backoff.ms=1000
spring.kafka.producer.properties.enable.idempotence=true